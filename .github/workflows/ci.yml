name: CI

on:
  pull_request:
    branches: [development, "release/**", main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [development, "release/**", main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  NEXT_TELEMETRY_DISABLED: "1"
  DATABASE_URL: "postgresql://lensistry:lensistry@127.0.0.1:5432/lensistry?schema=public"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint

  format:
    name: Formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run format:check

  typecheck:
    name: Web and API typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun --bun next typegen
      - run: bun run typecheck
      - run: bun run typecheck:api

  api-tests:
    name: API unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun run test:api

  build:
    name: Web build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun run build

  playwright-qa:
    name: Playwright QA
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DATABASE_URL: "postgresql://lensistry:lensistry@127.0.0.1:5433/lensistry_qa"
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_USER: lensistry
          POSTGRES_PASSWORD: lensistry
          POSTGRES_DB: lensistry_qa
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U lensistry -d lensistry_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:qa
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: .local/qa-report/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  ci-gate:
    name: CI Gate
    needs: [lint, format, typecheck, api-tests, build]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Summarize and enforce checks
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          FORMAT_RESULT: ${{ needs.format.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          API_RESULT: ${{ needs.api-tests.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          {
            printf '## CI results\n\n'
            printf '| Check | Result |\n| --- | --- |\n'
            printf '| Lint | %s |\n' "$LINT_RESULT"
            printf '| Formatting | %s |\n' "$FORMAT_RESULT"
            printf '| Typecheck | %s |\n' "$TYPECHECK_RESULT"
            printf '| API tests | %s |\n' "$API_RESULT"
            printf '| Build | %s |\n' "$BUILD_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
          for result in "$LINT_RESULT" "$FORMAT_RESULT" "$TYPECHECK_RESULT" "$API_RESULT" "$BUILD_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "::error::Required CI check failed, cancelled or skipped."
              exit 1
            fi
          done
