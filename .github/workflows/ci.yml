name: CI

on:
  pull_request:
    branches: [development, "release/**", main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [development, "release/**", main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  NEXT_TELEMETRY_DISABLED: "1"
  DATABASE_URL: "postgresql://lensistry:lensistry@127.0.0.1:5432/lensistry?schema=public"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint

  format:
    name: Formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run format:check

  typecheck:
    name: Web and API typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun --bun next typegen
      - run: bun run typecheck
      - run: bun run typecheck:api

  api-tests:
    name: API unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun run test:api

  python-tests:
    name: Python API checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install lightweight test dependencies
        run: python -m pip install "fastapi>=0.115,<1" "pydantic>=2.11,<3" "pillow>=11,<13" "pytest>=8,<10" "httpx>=0.28,<1" "ruff>=0.12,<1"
      - name: Test FastAPI validation
        working-directory: services
        run: python -m pytest -q
      - name: Lint Python code
        working-directory: services
        run: ruff check .

  build:
    name: Web build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun run build

  ci-gate:
    name: CI Gate
    needs: [lint, format, typecheck, api-tests, python-tests, build]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Summarize and enforce checks
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          FORMAT_RESULT: ${{ needs.format.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          API_RESULT: ${{ needs.api-tests.result }}
          PYTHON_RESULT: ${{ needs.python-tests.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          {
            printf '## CI results\n\n'
            printf '| Check | Result |\n| --- | --- |\n'
            printf '| Lint | %s |\n' "$LINT_RESULT"
            printf '| Formatting | %s |\n' "$FORMAT_RESULT"
            printf '| Typecheck | %s |\n' "$TYPECHECK_RESULT"
            printf '| API tests | %s |\n' "$API_RESULT"
            printf '| Python checks | %s |\n' "$PYTHON_RESULT"
            printf '| Build | %s |\n' "$BUILD_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
          for result in "$LINT_RESULT" "$FORMAT_RESULT" "$TYPECHECK_RESULT" "$API_RESULT" "$PYTHON_RESULT" "$BUILD_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "::error::Required CI check failed, cancelled or skipped."
              exit 1
            fi
          done
