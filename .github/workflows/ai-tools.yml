name: Standalone AI tooling

on:
  pull_request:
    branches: [development, "release/**", main]
    paths:
      - "services/**"
      - ".github/workflows/ai-tools.yml"
  push:
    branches: [development, "release/**", main]
    paths:
      - "services/**"
      - ".github/workflows/ai-tools.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tooling checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install lightweight test dependencies
        run: python -m pip install "fastapi>=0.115,<1" "pydantic>=2.11,<3" "pillow>=11,<13" "pytest>=8,<10" "httpx>=0.28,<1" "ruff>=0.12,<1"
      - run: python -m pytest -q
      - run: ruff check .
