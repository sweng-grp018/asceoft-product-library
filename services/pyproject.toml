[project]
name = "lensistry-ai"
version = "0.1.0"
description = "Lensistry POC image detection and visual embeddings"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.11,<3",
  "pillow>=11,<13",
  "numpy>=2,<3",
  "torch>=2.6,<3",
  "ultralytics>=8.3,<9",
  "open-clip-torch>=3,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12,<1"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
