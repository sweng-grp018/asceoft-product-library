name: lensistry

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: lensistry
      POSTGRES_USER: lensistry
      # Local development only. Never reuse this password elsewhere.
      POSTGRES_PASSWORD: lensistry
    ports:
      # 5433 avoids collisions with a host-installed PostgreSQL on 5432.
      # Override with DB_PORT if 5433 is also taken, and update DATABASE_URL to match.
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lensistry -d lensistry"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
